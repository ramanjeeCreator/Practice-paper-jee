    let practiceData = [...staticData];

    // Function to fetch data dynamically from Google Sheet
    async function loadSheetData() {
        if (!SHEET_ID || SHEET_ID === 'YOUR_GOOGLE_SHEET_ID_HERE') return;

        const sheetUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

        try {
            const res = await fetch(sheetUrl);
            const text = await res.text();
            
            // Extract valid JSON from Google's response string
            const json = JSON.parse(text.substring(47, text.length - 2));
            const rows = json.table.rows;

            const fetchedData = rows.map(row => {
                return {
                    Input: row.c[0] ? row.c[0].v : "",
                    Link: row.c[1] ? row.c[1].v : "#"
                };
            }).filter(item => item.Input && item.Link !== "#");

            if (fetchedData.length > 0) {
                // Prepend live Google Sheet entries so new links display first
                practiceData = [...fetchedData, ...staticData];
            }
        } catch (error) {
            console.warn("Could not fetch Google Sheet data, using static dataset instead.", error);
        }
    }

    // Call fetch function when script runs
    loadSheetData();

    // UI Elements
    const searchInput = document.getElementById('search-input');
    const resultsContainer = document.getElementById('results-container');
    const resultsList = document.getElementById('results-list');
    const noResults = document.getElementById('no-results');

    // Search Event Listener
    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();

        // Clear previous results
        resultsList.innerHTML = '';

        // If input is empty, hide lists and exit
        if (query === '') {
            resultsContainer.classList.add('hidden');
            noResults.classList.add('hidden');
            return;
        }

        // Filter data matching the query
        const filteredData = practiceData.filter(item =>
            item.Input.toLowerCase().includes(query)
        );

        if (filteredData.length > 0) {
            resultsContainer.classList.remove('hidden');
            noResults.classList.add('hidden');

            filteredData.forEach(item => {
                const li = document.createElement('li');
                li.className = "pl-2 py-1.5 hover:bg-slate-50 rounded-lg transition-colors group";

                const a = document.createElement('a');
                a.href = item.Link;
                a.target = "_blank";
                a.textContent = item.Input;
                a.className = "text-blue-600 font-medium hover:text-indigo-600 hover:underline inline-block";

                li.appendChild(a);
                resultsList.appendChild(li);
            });
        } else {
            resultsContainer.classList.add('hidden');
            noResults.classList.remove('hidden');
        }
    });
</script>
