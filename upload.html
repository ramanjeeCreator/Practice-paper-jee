<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Upload</title>
<style>
body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.card{
    width:420px;
    background:#1e293b;
    padding:20px;
    border-radius:16px;
}
input,button{
    width:100%;
    margin-top:10px;
    padding:10px;
}
.progress{
    height:20px;
    background:#334155;
    border-radius:10px;
    overflow:hidden;
    margin-top:15px;
}
.bar{
    height:100%;
    width:0%;
    background:#22c55e;
}
.note{
    margin-top:10px;
    font-size:12px;
    color:#94a3b8;
}
</style>
</head>
<body><div class="card">
    <h2>Contribute your Study Material</h2><input type="file" id="file">
<input type="url" placeholder="Paste URL (optional)">
<button onclick="startUpload()">Upload</button>

<div class="progress">
    <div class="bar" id="bar"></div>
</div>

<p id="status">Waiting...</p>

<div class="note">
        Thank you for contributing your study material here 🙂.        </div>

</div><script>
function startUpload(){
    let p=0;
    let size=(Math.random()*495+5).toFixed(0);

    document.getElementById("status").innerText=
    "Preparing " + size + " MB file...";

    let timer=setInterval(()=>{
        p+=Math.random()*4;

        if(p>=100){
            p=100;
            clearInterval(timer);
            document.getElementById("status").innerText=
            "Simulation Complete";
        }

        document.getElementById("bar").style.width=p+"%";
    },150);
}
</script></body>
</html>
